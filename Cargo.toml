[package]
name = "serial-capture"
version = "0.1.0"
edition = "2021"
description = "Dump USB serial output with auto-reconnect and text/JSON/CSV logs"
license = "MIT"
repository = "https://github.com/brianlechthaler/serial_capture"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.45", features = ["derive"] }
hmac = "0.12.1"
serde_json = "1.0.143"
serialport = { version = "4.7.3", default-features = false }
sha2 = "0.10.9"

[[bin]]
name = "serial-capture-mcp"
path = "src/bin/serial_capture_mcp.rs"

[dev-dependencies]
libc = "0.2.175"
